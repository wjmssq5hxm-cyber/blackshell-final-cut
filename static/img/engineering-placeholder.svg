<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="engbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#1b2330" />
    </linearGradient>
    <filter id="engglow"><feGaussianBlur stdDeviation="1" /></filter>
  </defs>
  <rect width="200" height="200" fill="url(#engbg)" />

  <!-- Faint blueprint grid -->
  <g stroke="#93b8ce" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="40" x2="200" y2="40" />
    <line x1="0" y1="80" x2="200" y2="80" />
    <line x1="0" y1="120" x2="200" y2="120" />
    <line x1="0" y1="160" x2="200" y2="160" />
    <line x1="40" y1="0" x2="40" y2="200" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="120" y1="0" x2="120" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
  </g>

  <!-- Single-line diagram: source bus → transformer → breaker → load -->
  <g stroke="#93b8ce" stroke-width="1.2" fill="none" filter="url(#engglow)" opacity="0.9">
    <!-- Source bus bar -->
    <line x1="20" y1="60" x2="20" y2="140" />
    <!-- Lead to transformer -->
    <line x1="20" y1="100" x2="55" y2="100" />
    <!-- Transformer symbol: two intersecting circles -->
    <circle cx="65" cy="100" r="10" />
    <circle cx="80" cy="100" r="10" />
    <!-- Lead to breaker -->
    <line x1="90" y1="100" x2="115" y2="100" />
    <!-- Circuit breaker: boxed X -->
    <rect x="115" y="92" width="16" height="16" />
    <line x1="115" y1="92" x2="131" y2="108" />
    <line x1="131" y1="92" x2="115" y2="108" />
    <!-- Lead to load -->
    <line x1="131" y1="100" x2="160" y2="100" />
    <!-- Load: arrow -->
    <path d="M160 100 L178 100 M173 95 L178 100 L173 105" />
  </g>

  <!-- Dimension line (drafting style) -->
  <g stroke="#5b7c8d" stroke-width="0.4" opacity="0.4">
    <line x1="20" y1="170" x2="178" y2="170" />
    <line x1="20" y1="166" x2="20" y2="174" />
    <line x1="178" y1="166" x2="178" y2="174" />
  </g>

  <!-- Title block at top right (a drafting convention) -->
  <g stroke="#93b8ce" stroke-width="0.3" opacity="0.3" fill="none">
    <rect x="150" y="15" width="40" height="20" />
    <line x1="150" y1="25" x2="190" y2="25" />
    <line x1="170" y1="15" x2="170" y2="35" />
  </g>
</svg>
