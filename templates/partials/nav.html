{% load static %}
<nav class="sticky top-0 z-40 bg-ink/90 backdrop-blur-md border-b border-hair">
  <div class="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-8">
      <a href="{% url 'home' %}" class="flex items-center gap-3 group">
        <img src="{% static 'img/logo.png' %}" alt="{{ site.company_name }}" width="36" height="36"
             class="logo-mark w-9 h-9 object-contain" />
        <span class="hidden sm:block text-frost font-bold tracking-wider text-sm">
          {{ site.company_name|upper }}
        </span>
      </a>

      <div class="hidden md:flex items-center gap-6 ml-4">
        {% for link in nav_links %}
          <a href="{% url link.url_name %}"
             {% if request.resolver_match.url_name == link.url_name %}aria-current="page"{% endif %}
             class="text-[13px] tracking-wider transition-colors font-semibold {% if request.resolver_match.url_name == link.url_name %}text-frost{% else %}text-gray-300 hover:text-frost{% endif %}">
            {{ link.label }}
          </a>
        {% endfor %}
      </div>
    </div>

    <div class="flex items-center gap-4">
      <button type="button" data-nav-toggle
              class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg text-gray-300 hover:text-white hover:bg-white/5 transition-colors"
              aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </div>

  <div data-nav-backdrop class="hidden fixed inset-0 bg-black/70 z-50 md:hidden" aria-hidden="true"></div>

  <div id="mobile-drawer" data-nav-drawer role="dialog" aria-modal="true"
       class="hidden fixed top-0 right-0 bottom-0 w-[82%] max-w-[320px] bg-ink border-l border-hair z-[60] md:hidden flex-col">
    <div class="flex items-center justify-between px-6 py-5 border-b border-hair">
      <a href="{% url 'home' %}" class="flex items-center gap-3" data-nav-close>
        <img src="{% static 'img/logo.png' %}" alt="{{ site.company_name }}" width="28" height="28" class="logo-mark w-7 h-7 object-contain" />
        <span class="text-frost font-bold tracking-wider text-sm">{{ site.company_name|upper }}</span>
      </a>
      <button type="button" data-nav-close
              class="w-10 h-10 -mr-2 flex items-center justify-center text-gray-400 hover:text-white"
              aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="flex-1 px-6 py-8 space-y-1 text-lg">
      {% for link in nav_links %}
        <a href="{% url link.url_name %}" data-nav-close
           {% if request.resolver_match.url_name == link.url_name %}aria-current="page"{% endif %}
           class="block py-3.5 px-1 tracking-[0.02em] font-semibold border-b border-hair last:border-b-0 transition-colors {% if request.resolver_match.url_name == link.url_name %}text-frost{% else %}text-gray-200 hover:text-frost{% endif %}">
          {{ link.label }}
        </a>
      {% endfor %}
    </div>
  </div>
</nav>
