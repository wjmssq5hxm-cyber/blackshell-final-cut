{% load static %}<!doctype html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>{% block title %}{{ site.meta_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.meta_description }}{% endblock %}">
  <link rel="canonical" href="{{ request.build_absolute_uri }}">
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/logo.png' %}">
  <meta property="og:title" content="{% block og_title %}{{ site.company_name }} — Chicago{% endblock %}">
  <meta property="og:description" content="{{ site.meta_description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800;900&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="min-h-full flex flex-col bg-ink text-white">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-[100] focus:px-4 focus:py-2 focus:bg-frost focus:text-black focus:rounded-full focus:text-sm focus:font-bold">
    Skip to content
  </a>
  {% include "partials/nav.html" %}

  <div class="hidden lg:flex fixed left-0 top-1/2 -translate-y-1/2 z-30 px-3">
    <div class="vertical-text text-[10px] text-frost/70 font-mono">
      {{ site.side_rail }}
    </div>
  </div>

  <main id="main" class="flex-1 lg:pl-12">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="{% static 'js/nav.js' %}" defer></script>
</body>
</html>
